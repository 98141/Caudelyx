worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  sendfile on;
  client_max_body_size 6m;
  client_body_timeout 30s;
  keepalive_timeout 30s;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_certificate /run/tls/cert.pem;
  ssl_certificate_key /run/tls/key.pem;
  ssl_session_cache shared:TLS:1m;
  ssl_session_tickets off;

  # Never trust client-supplied forwarding headers. Product sees real TLS,
  # the original exact Host/Origin and no rewrite of cookies or CSRF headers.
  proxy_ssl_verify on;
  proxy_ssl_verify_depth 2;
  proxy_ssl_trusted_certificate /run/tls/api-ca.pem;
  proxy_ssl_server_name on;
  proxy_ssl_name api;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For "";
  proxy_set_header X-Forwarded-Host "";
  proxy_set_header X-Forwarded-Proto "";
  proxy_set_header Forwarded "";
  proxy_connect_timeout 5s;
  proxy_read_timeout 75s;
  proxy_send_timeout 75s;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_intercept_errors off;
  # Preserve the product's response headers, including its stricter API CSP.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy 'camera=(), microphone=(), geolocation=(), publickey-credentials-get=(self), publickey-credentials-create=(self)' always;
  add_header Cache-Control no-store always;

  server {
    listen 3001 ssl default_server;
    server_name ${TENANT_HOST};
    if ($http_host != '${TENANT_AUTHORITY}') { return 444; }
    root /usr/share/nginx/html;
    index index.html;
    location ^~ /api/ { proxy_pass https://api:4001; }
    # Hash routing: no fallback that disguises missing assets as HTML.
    location / { try_files $uri $uri/ =404; }
  }
  server {
    # Separate networks and listeners; external platform port maps to3443.
    listen 3443 ssl default_server;
    server_name ${PLATFORM_HOST};
    if ($http_host != '${PLATFORM_AUTHORITY}') { return 444; }
    root /usr/share/nginx/html;
    index index.html;
    location ^~ /api/ { proxy_pass https://api:4002; }
    location / { try_files $uri $uri/ =404; }
  }
}
